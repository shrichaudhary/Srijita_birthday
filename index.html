<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Srijita! ✨ | Gadhi Day</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0b0614; }
    #birthdayPage { display: block; width: 100%; min-height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="birthdayPage" title="Happy Birthday Srijita"></iframe>
  <script>
    const iframe = document.getElementById('birthdayPage');
    iframe.src = 'Srijita%20Birthday%20Special%20(3).html';

    iframe.addEventListener('load', () => {
      const doc = iframe.contentDocument;
      if (!doc) return;

      // Keep only the photos in the gallery: remove titles, descriptions,
      // hover labels, and card click behavior that opens captioned modals.
      const gallery = doc.querySelector('#gallery-section');
      if (gallery) {
        gallery.querySelectorAll('.polaroid-frame').forEach((card) => {
          card.querySelectorAll('.pt-3, .absolute.inset-0').forEach((caption) => caption.remove());
          card.removeAttribute('onclick');
          card.style.cursor = 'default';
        });
      }

      // Also hide text in the lightbox so no caption appears if an old
      // interaction opens it from a cached page.
      const modalText = doc.querySelector('#photoModal > div > div.mt-4');
      if (modalText) modalText.remove();

      const resize = () => {
        iframe.style.height = `${Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight)}px`;
      };
      resize();
      setTimeout(resize, 500);
      setTimeout(resize, 1500);
      window.addEventListener('resize', resize);
    });
  </script>
</body>
</html>
